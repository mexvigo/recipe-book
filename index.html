<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16130e" />
  <title>Recipe Book</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Home / list view ===== -->
  <header class="app-header" id="home-header">
    <div class="header-inner">
      <div class="statusbar">
        <span class="sb-left mono">RECIPE_DB</span>
        <span class="sb-right mono" id="result-count">—</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">THEME</button>
      </div>
      <div class="search-wrap">
        <span class="prompt mono">SEARCH</span>
        <input id="search" type="search" inputmode="search" placeholder="title or ingredient…" autocomplete="off" aria-label="Search recipes" />
        <button id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>
      </div>
      <nav class="chips" id="category-chips" aria-label="Categories"></nav>
    </div>
  </header>

  <main id="list-view">
    <ul id="recipe-list" class="tile-grid"></ul>
    <p id="empty-state" class="empty-state" hidden>NO MATCH FOUND</p>
  </main>

  <!-- ===== Detail view ===== -->
  <article id="detail-view" class="detail" hidden></article>

  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
